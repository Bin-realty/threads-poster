name: 發文 Post to Threads

on:
  push:
    branches: [main]
    paths: ["publish/**", "delete/**", "sync/**", "outbox/**", "drafts/**"]
  schedule:
    - cron: "*/15 * * * *"   # 每 15 分鐘檢查排程貼文是否到期
  workflow_dispatch:
    inputs:
      listing:
        description: "物件資料夾名稱（listings/ 底下）"
        required: true
      mode:
        description: "post=發布、dry=試跑不發、force=忽略 3 天防洗版"
        required: true
        default: post
        type: choice
        options: [post, dry, force]

permissions:
  contents: write

concurrency:
  group: threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 建立手動指令
        if: github.event_name == 'workflow_dispatch'
        run: echo "${{ inputs.mode }}" > "publish/${{ inputs.listing }}"
      - name: 同步照片＋從 Google 相簿匯入照片
        run: |
          python3 scripts/queue.py queue
          if ls sync/* >/dev/null 2>&1; then pip install -q pillow; python3 scripts/threads.py sync; fi
          python3 scripts/threads.py import
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add -A listings sync drafts publish delete schedule.json 2>/dev/null || git add -A listings sync drafts publish delete
          if ! git diff --cached --quiet; then
            git commit -q -m "匯入相簿照片 $(TZ=Asia/Taipei date '+%F %R')"
            git pull --rebase -q && git push -q
          fi
          echo "PHOTO_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: 發文
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
        run: |
          python3 scripts/threads.py delete
          python3 scripts/threads.py process
          python3 scripts/threads.py comments || echo "留言處理失敗（不影響發文）"
      - name: 儲存發文紀錄
        if: always()
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          python3 scripts/queue.py settle || true
          git add -A listings publish delete sync outbox drafts; if [ -f schedule.json ]; then git add schedule.json; fi; for f in comments.json reply_log.json; do if [ -f $f ]; then git add $f; fi; done
          git diff --cached --quiet || git commit -m "發文紀錄 $(TZ=Asia/Taipei date '+%F %R')"
          git pull --rebase -q && git push -q
